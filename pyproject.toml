[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fredrickir-linkaudit"
version = "0.1.0"
description = "外链可达性校验，分开暂时不可达与已失效"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "fredrickir" }]
keywords = ["links", "http", "audit", "markdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/fredrickir/linkaudit"
Repository = "https://github.com/fredrickir/linkaudit"
Issues = "https://github.com/fredrickir/linkaudit/issues"

[project.scripts]
linkaudit = "linkaudit:main"

[tool.setuptools]
py-modules = ["linkaudit"]
